# Bitbucket's TLS cert is a Cloudflare Origin CA cert, not in any public trust
# store — the default checkout fails with "unable to get local issuer
# certificate" without this. Same override the mirror pipeline uses.
clone:
  git:
    image: harbor.devopstashtiot.page/plugins/plugin-git-cert:prod
    settings:

when:
  - event: [push,manual]
    branch: master

steps:
# ========================================== master version ==============================================================
- name: Run release
    image: netanelzucaim123/master-versions:v1.0.1
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_OUTPUT_TAGS_FILE: "new_tags.txt"
      PLUGIN_BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      PLUGIN_MESSAGE: "${MESSAGE}"
      PLUGIN_VERBOSE: "0"
      PLUGIN_CHANGELOG_LEVEL: "0"
# ========================================== RUN SONAR SCAN ==============================================================
- name: SonarQube
    image: artifactory.app.com/woodpecker/plugins/sonarqube:latest 
    settings:
      sonar_host: https://tashtiot.sonarqube.app.com
      sonar_token:
        from_secret: sonar_token
    extra_properties: -Dsonar.projectVersion=$(if [ -s new_tags.txt ]; then cat new_tags.txt | tr -d '\n'; else cat tags.txt | tr -d '\n'; fi)


