- name: Build image and push
  image: harbor.devopstashtiot.page/woodpecker/plugins/kaniko:latest
  settings:
    registry: harbor.devopstashtiot.page
    username: svc_dev_admin
    password:
      from_secret: artifactory_token
    repo: docker-dev-local/devops-api
    tags: ${CI_COMMIT_TAG}
  depends_on: [SonarQube]