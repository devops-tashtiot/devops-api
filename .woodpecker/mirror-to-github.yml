# Bitbucket is the sole source of truth for this repo — push directly into
# it over HTTPS (past Cloudflare Access's email-OTP wall using the
# bitbucket-push service token; see devtools-labs Terraform's cloudflare
# module and the top-level devops/CLAUDE.md's "Bitbucket push access"
# section). Every push here re-syncs the full repo (all branches and tags)
# onto GitHub at github.com/devops-tashtiot/devops-api with `git push
# --mirror`. GitHub is branch-protected to be read-only except for this
# pipeline's push identity — never push to it directly, and the next sync
# would overwrite it even if you did.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true
      custom_ssl_url: https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem

when:
  - event: push

steps:
  - name: Mirror to GitHub
    image: alpine/git
    environment:
      BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # Bitbucket's TLS cert is a Cloudflare Origin CA cert, not in any public
      # trust store — disable verification for these in-cluster git calls, the
      # same way publish.yml's working "Push changelogs to Git" step does.
      - git config --global http.sslVerify false
      # CRITICAL: the secret env vars below are written as doubled-dollar-brace
      # (dollar dollar brace VAR brace). Woodpecker runs drone/envsubst over the
      # ENTIRE raw pipeline file (comments included!) before parsing it, so a
      # single-dollar-brace reference gets emptied, and the doubled dollar makes
      # Woodpecker emit one literal dollar-brace reference for the shell to
      # expand at runtime. This is the documented Woodpecker escape, the same
      # one pr.yml/publish.yml use for their shell vars. NOTE: for that same
      # reason this comment must not contain a raw dollar-brace-dot-dot-dot
      # placeholder — drone/envsubst fails the whole file with "unable to parse
      # variable name" if it sees one, even inside a comment.
      #
      # This Bitbucket DC instance accepts its HTTP access token ONLY as an
      # `Authorization: Bearer <token>` header — NOT as x-token-auth in the URL
      # (that returns 401). Single-quoted so YAML doesn't read the colon-space
      # in the header as a map key.
      - 'git -c http.extraheader="Authorization: Bearer $${BITBUCKET_TOKEN}" clone --mirror "https://bitbucket.devopstashtiot.page/scm/devopstashtiot/devops-api.git" repo-mirror'
      - cd repo-mirror
      - git push --mirror "https://x-access-token:$${GITHUB_TOKEN}@github.com/devops-tashtiot/devops-api.git"
