# Bitbucket is the sole source of truth for this repo — push directly into
# it over HTTPS (past Cloudflare Access's email-OTP wall using the
# bitbucket-push service token; see devtools-labs Terraform's cloudflare
# module and the top-level devops/CLAUDE.md's "Bitbucket push access"
# section). Every push here re-syncs the full repo (all branches, tags, and
# their deletions) onto GitHub at github.com/devops-tashtiot/devops-api with
# `git push --mirror`. GitHub is branch-protected to be read-only except for
# this pipeline's push identity — never push to it directly, and the next
# sync would overwrite it even if you did.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: false
      custom_ssl_url: https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem

when:
  - event: push

steps:
  - name: Mirror to GitHub
    image: alpine/git
    environment:
      BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      # Bitbucket's TLS cert is a Cloudflare Origin CA cert, not in any
      # public trust store — same reason plugins/master-versions/Dockerfile
      # and a-woodpecker-plugins/.woodpecker/publish.yml's clone step both
      # trust it explicitly rather than disabling verification.
      - apk add --no-cache curl ca-certificates
      - curl -sf https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem -o /usr/local/share/ca-certificates/cf-origin-ca.crt
      - update-ca-certificates
      # This Bitbucket DC instance accepts its HTTP access tokens ONLY as an
      # `Authorization: Bearer <token>` header — NOT as `x-token-auth:<token>`
      # basic-auth in the URL (that returns 401). Sent via a per-command
      # `-c http.extraheader` so the header is scoped to just this clone and is
      # never carried onto the separate `git push` to GitHub below. Woodpecker
      # masks the secret value in the logs, so it will render as `Bearer ***`.
      - git -c http.extraheader="Authorization: Bearer ${BITBUCKET_TOKEN}" clone --mirror "https://bitbucket.devopstashtiot.page/scm/devopstashtiot/devops-api.git" repo-mirror
      - cd repo-mirror
      - git push --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/devops-tashtiot/devops-api.git"
