# Runs on manual trigger, or on a merge commit landing on master: python checks ->
# Sonar scan -> master-versions -> buildah build & push -> push CHANGELOG.md + release
# tags back to git. This is the "official" release path (pull_request.yaml is the preview).
clone:
  git:
    image: harbor.devopstashtiot.page/plugins/plugin-git-cert:prod
    settings:
      depth: 1
      tags: false
      # partial-clone (plugin-git default ON) forces a shallow clone and silently
      # ignores `depth: 0`; a shallow graft severs ancestry so master-versions'
      # `git describe` finds no tag. `partial: false` + `depth: 0` = real full clone.
      partial: false

when:
  - event: manual
    branch: [feat/*, hotfix/*, bugfix/*, fix/*]
  - event: push
    branch: master
    evaluate: 'CI_COMMIT_MESSAGE contains "Merge pull request"'

steps:
  - name: run python checks
    image: harbor.devopstashtiot.page/base/uv/0.11.29/python-312:v1.0.0
    commands:
      - uv sync
      # Exclude @pytest.mark.integration — those hit live services (SonarQube, Bitbucket,
      # MinIO, ...) that don't exist in the build runner and would error on connect.
      - uv run pytest -m "not integration" --cov=app --cov-report=xml --junitxml=test-report.xml
      - uv run ruff check .
      - uv run ruff format --check .

  - name: SonarQube
    image: harbor.devopstashtiot.page/plugins/sonarqube:v1.0.0
    settings:
      sonar_host: https://sonarqube.devopstashtiot.page
      sonar_token:
        from_secret: sonar_token
      extra_properties: -Dsonar.projectVersion=$(if [ -s new-tags.txt ]; then cat new-tags.txt | tr -d '\n'; else cat tags.txt | tr -d '\n'; fi)

  - name: Run release
    image: netanelzucaim123/master-versions:v1.0.5
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_OUTPUT_TAGS_FILE: "new_tags.txt"
      PLUGIN_BITBUCKET_TOKEN:
        from_secret: bitbucket_token
      PLUGIN_MESSAGE: "${MESSAGE}"
      PLUGIN_VERBOSE: 2
      PLUGIN_CHANGELOG_LEVEL: "0"

  - name: Build and push image
    image: harbor.devopstashtiot.page/plugins/buildah-master-versions:latest
    privileged: true
    environment:
      PLUGIN_BASE_PATH: "."
      PLUGIN_REGISTRY: "harbor.devopstashtiot.page"
      PLUGIN_REPO: "docker-dev-local/devops-api"
      PLUGIN_TAGS_FILE: "new_tags.txt"
      PLUGIN_ALIASES: "prod"
      PLUGIN_USERNAME: "admin"
      PLUGIN_PASSWORD:
        from_secret: harbor_password

  - name: Push changelogs to Git
    image: harbor.devopstashtiot.page/base/git-cert:prod
    environment:
      PLUGIN_BASE_PATH: .
      SCOPE_DEPTH: "1"
    commands:
      - |
        for var in SCOPE_DEPTH PLUGIN_BASE_PATH; do
          val=$(grep -m 1 "^$${var}=" pr_body.txt | cut -d= -f2-)
          if [ -n "$val" ]; then
            export "$var=$val"
            echo ">>> Override: $var=$val"
          fi
        done
      - echo ">>> SCOPE_DEPTH=$SCOPE_DEPTH PLUGIN_BASE_PATH=$PLUGIN_BASE_PATH"
      - git config --global user.email "ci-bot@example.com"
      - git config --global user.name "CI Bot"
      - git config --global safe.directory '*'
      - find . -name "CHANGELOG.md" -not -path "./.git/*" | xargs -r git add
      - |
        # Push the changelog commit + release tags to the branch THIS run is on
        # (CI_COMMIT_BRANCH) — NEVER hardcoded. CI_COMMIT_BRANCH is escaped `$${...}`
        # so Woodpecker doesn't substitute it before the shell sees it.
        if [ -n "$${CI_COMMIT_BRANCH}" ]; then
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update CHANGELOG.md files [skip ci]"
            git push --force origin "HEAD:$${CI_COMMIT_BRANCH}"
          else
            echo "No changelog changes to commit."
          fi
          for tag in $(cat new_tags.txt); do git tag -f "$tag"; done
          git push --force --tags origin
          echo ">>> Pushed changelog + tags to branch '$${CI_COMMIT_BRANCH}'."
        else
          echo ">>> No CI_COMMIT_BRANCH set — skipping changelog/tag push."
        fi
