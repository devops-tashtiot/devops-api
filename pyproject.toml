[project]
name = "devops-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.27.2",
    "loguru>=0.7.0",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.7",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.3",
    "starlette>=0.41.3",
    "starlette-exporter>=0.21.0",
    "tashtiot-apis-library @ https://github.com/Platform-Infra-Org/apis-library/releases/download/v1.2.1/tashtiot_apis_library-1.2.1-py3-none-any.whl",
    "uvicorn>=0.22.0",
]

# This app has no build backend / packaging metadata of its own — it's deployed as a plain
# directory copied into a container, not installed as a wheel. package = false stops uv from
# trying to build and install it into its own venv.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.6.0",
    "httpx>=0.19.2",
    "ruff>=0.4.0",
]

[tool.ruff.lint]
# E4/E7/E9 (not full E — E501 line-length is the formatter's job), plus pyflakes,
# isort, pyupgrade, bugbear, ruff. B008 is the idiomatic FastAPI Depends() default.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["E402", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires live services (Confluence, MinIO, Bitbucket, etc.)",
]
